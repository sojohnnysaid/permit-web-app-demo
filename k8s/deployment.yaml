apiVersion: apps/v1
kind: Deployment
metadata:
  name: tops-frontend
  labels:
    app: tops-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tops-frontend
  template:
    metadata:
      labels:
        app: tops-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/sojohnnysaid/permit-web-app-demo:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
